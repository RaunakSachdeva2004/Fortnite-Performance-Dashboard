name: Build and Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore FortniteDashboard.sln

    - name: Build
      run: dotnet build FortniteDashboard.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test FortniteDashboard.sln --no-build --verbosity normal

    - name: Publish
      run: dotnet publish FortniteDashboard/FortniteDashboard.csproj --configuration Release --output ./publish
