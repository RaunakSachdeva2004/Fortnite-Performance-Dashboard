version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=SQLite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/FortniteDashboard.db
    volumes:
      - app-data:/app/data

volumes:
  app-data:
